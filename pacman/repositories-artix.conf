# Personal packages take precedence over the Arch fallback repository.
[raf]
SigLevel = PackageRequired TrustedOnly DatabaseOptional
Server = https://github.com/rozeraf/raf-repo/releases/download/$arch

# Arch packages unavailable in Artix. Protected by 00-block-systemd.hook.
[extra]
Include = /etc/pacman.d/mirrorlist-arch
