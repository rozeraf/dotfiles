config_version = 13

[bar]
order = [ "default", "bar" ]

    [bar.bar]
    center = [ "workspaces" ]
    enabled = true
    end = []
    margin_ends = 450
    position = "left"
    reserve_space = false
    smart_auto_hide = true
    start = []

    [bar.default]
    enabled = true
    end = [ "tray", "keyboard_layout", "volume", "battery", "session" ]
    margin_ends = 0
    start = [ "launcher", "widget", "media" ]

        [bar.default.dead_zone.actions]
        scroll_down = "volume-down 2"
        scroll_up = "volume-up 2"

    [bar.widgets]
    center = []
    enabled = false
    end = []
    start = []

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugins]
enabled = [ "alexander/screen-toolkit" ]

[shell]
clipboard_auto_paste = "off"

    [shell.launcher]
    auto_paste = "off"

[theme]
source = "wallpaper"
wallpaper_scheme = "m3-rainbow"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "ghostty", "niri", "starship" ]
    community_ids = [ "zen-browser", "zed", "fastfetch", "yazi" ]

[wallpaper]
directory = "/home/raf/Pictures/Wallpapers"

    [wallpaper.default]
    path = "/home/raf/Pictures/Wallpapers/overlapping-pills-1920x1080(8).png"

    [wallpaper.last]
    path = "/home/raf/Pictures/Wallpapers/overlapping-pills-1920x1080(8).png"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/raf/Pictures/Wallpapers/overlapping-pills-1920x1080(8).png"

[widget.keyboard_layout]
show_glyph = false

[widget.notifications]
anchor = true

[widget.tray]
drawer = true

[widget.volume]
show_label = false

[widget.widget]
type = "alexander/screen-toolkit:widget"