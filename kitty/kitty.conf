font_family      Monaspace Neon NF Medium
font_size        12.5
symbol_map       U+0024 JetBrainsMono Nerd Font

background          #101010
foreground          #D8D2D8
background_opacity  0.88

cursor                  #D787FF
cursor_text_color       #101010
cursor_shape            block
cursor_blink_interval   0
cursor_trail            3
cursor_trail_decay      0.1 0.4

selection_background    #43284D
selection_foreground    #FFFFFF

window_padding_width    10 14
hide_window_decorations yes
confirm_os_window_close 0
mouse_hide_wait         3.0

tab_bar_min_tabs        2
tab_bar_style           powerline

map ctrl+shift+c copy_to_clipboard
